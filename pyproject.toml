[project]
name = "url-intelligence"
version = "0.1.0"
description = "Turn URLs into AI-readable content, then analyze them with an LLM."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.86.0",
  "fastapi>=0.115.0",
  "httpx>=0.28.0",
  "markdownify>=1.1.0",
  "openai>=2.17.0",
  "pydantic>=2.12.0",
  "pydantic-settings>=2.10.0",
  "python-dotenv>=1.0.1",
  "beautifulsoup4>=4.13.0",
  "uvicorn>=0.35.0",
  "youtube-transcript-api>=1.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
]

[project.scripts]
url-intel = "url_intelligence.cli:main"

[build-system]
requires = ["setuptools>=65.5.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
